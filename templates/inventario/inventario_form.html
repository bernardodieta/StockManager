{% extends 'base.html' %}

{% block title %}Inventario{% endblock title %}

{% block content %}
<div class="w-full max-w-2xl mx-auto bg-white rounded-xl border border-slate-200 shadow-sm p-6 md:p-8">
    <h1 class="text-2xl font-semibold text-slate-900">Inventario</h1>
    <p class="text-sm text-slate-600 mt-1 mb-6">Define un inventario principal para agrupar productos.</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="pt-2 flex items-center gap-3">
            <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white rounded-lg px-4 py-2">Guardar</button>
            <a href="{% url 'inventario_list' %}" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50">Cancelar</a>
        </div>
    </form>
</div>
{% endblock content %}
