{% extends 'base.html' %}

{% block title %}Eliminar inventario{% endblock title %}

{% block content %}
<div class="max-w-xl bg-white rounded-lg shadow p-6">
    <h1 class="text-xl font-semibold mb-4">Eliminar inventario</h1>
    <p class="mb-4">¿Seguro que deseas eliminar {{ object.nombre }}?</p>
    <form method="post" class="flex items-center gap-3">
        {% csrf_token %}
        <button type="submit" class="bg-red-700 text-white rounded px-4 py-2">Eliminar</button>
        <a href="{% url 'inventario_list' %}" class="px-4 py-2 border rounded">Cancelar</a>
    </form>
</div>
{% endblock content %}
