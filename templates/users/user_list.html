{% extends 'base.html' %}

{% block title %}Usuarios{% endblock title %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-semibold mb-4">Usuarios</h1>
    <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
            <thead>
                <tr class="text-left border-b">
                    <th class="py-2 pr-3">Usuario</th>
                    <th class="py-2 pr-3">Email</th>
                    <th class="py-2 pr-3">Rol</th>
                    <th class="py-2 pr-3">Activo</th>
                    <th class="py-2">Acción</th>
                </tr>
            </thead>
            <tbody>
                {% for row in users_list %}
                    <tr class="border-b">
                        <td class="py-2 pr-3">{{ row.username }}</td>
                        <td class="py-2 pr-3">{{ row.email }}</td>
                        <td class="py-2 pr-3">{{ row.profile.rol }}</td>
                        <td class="py-2 pr-3">{{ row.is_active }}</td>
                        <td class="py-2 space-x-3">
                            <a href="{% url 'users_update' row.pk %}" class="text-slate-900 font-medium">Editar</a>
                            <a href="{% url 'users_delete' row.pk %}" class="text-red-700 font-medium">Eliminar</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock content %}
