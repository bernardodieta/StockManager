{% extends 'base.html' %}

{% block title %}Salida de stock{% endblock title %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-semibold text-slate-900">Registrar salida de stock</h1>
        <p class="text-slate-500 mt-1 text-sm">Selecciona el producto y la cantidad a descontar.</p>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="pt-4 flex items-center gap-3">
                <button type="submit" class="bg-slate-900 text-white rounded px-4 py-2 text-sm">Registrar salida</button>
                <a href="{% url 'producto_list' %}" class="border border-slate-300 text-slate-700 rounded px-4 py-2 text-sm">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
